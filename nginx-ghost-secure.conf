# ----------------------------------------------------------------------
# TAVARDT Elite Ghost CMS (Node.js) NGINX Reverse Proxy Rules
# ----------------------------------------------------------------------
# Instructions: This block should be included in your main Nginx server block.
# It proxies external web traffic to the internal Node.js port (e.g., 2368).
# ----------------------------------------------------------------------

# 1. Bruteforce Rate Limiting (Declare this OUTSIDE the server block)
# Limits connections to 5 requests per second per IP specifically for the admin panel.
# limit_req_zone $binary_remote_addr zone=ghost_admin:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    server_name blog.tavardt.com;

    # Basic security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # 2. Main Reverse Proxy to Node.js
    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        
        # Point this to your internal Ghost Node.js instance
        proxy_pass http://127.0.0.1:2368;
        
        # Avoid passing along server identification
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # 3. Protect the Ghost Admin Panel (/ghost/)
    location ^~ /ghost/ {
        # Apply the rate limit defined outside the server block
        # limit_req zone=ghost_admin burst=10 nodelay;
        
        # Proxy settings
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_pass http://127.0.0.1:2368;

        # Optional B2B Security: Restrict Admin access to Corporate IPs
        # allow 123.456.789.0/24; # TAVARDT Office IP
        # deny all;
    }

    # 4. Cache Static Assets (Images, Themes)
    # Ghost serves static assets under /assets/ and /content/images/
    location ~ ^/(?:assets|content/images)/ {
        proxy_pass http://127.0.0.1:2368;
        expires max;
        add_header Cache-Control "public, max-age=31536000";
        access_log off;
    }
}
